# SPDX-License-Identifier: Apache-2.0
name: Health peer presentation
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - name: Genuine archived replay, history, keyboard and mobile parity
        env:
          HEALTH_BROWSER_PROOF: '1'
        run: uv run pytest tests/test_health_peer.py -v -s --timeout=180
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: health-peer-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/health-peer-browser
          if-no-files-found: error
