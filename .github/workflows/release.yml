# SPDX-License-Identifier: Apache-2.0
name: Release
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  release:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == github.sha
    permissions:
      contents: write
    # Commit of collaboration-guidelines v9.9.10. Issue #4 pins action inputs, not these workflow refs.
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@d0d9ae8e684f8a828b774eda01622b7c66e5252e # v9.9.10
  post-release:
    needs: release
    if: needs.release.outputs.published == 'true'
    # capability-verifier's comment job declares pull-requests: write.
    # With comment: false it never writes.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/report.yml
    with:
      definitions: tests/fixtures/robot/verifications/*.toml
      output-dir: artifacts/released-report
      version: ${{ needs.release.outputs.version }}
  post-release-check:
    needs: [release, post-release]
    if: needs.release.outputs.published == 'true' && needs.post-release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.git-tag }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verification-report
          path: artifacts/released-report
      - name: Verify the published action report
        env:
          STATUS: ${{ needs.post-release.outputs.status }}
          GRADES: ${{ needs.post-release.outputs.grades }}
          VERSION: ${{ needs.release.outputs.version }}
          GIT_TAG: ${{ needs.release.outputs.git-tag }}
          COMMIT: ${{ needs.release.outputs.commit }}
        run: |
          set -euo pipefail
          test "$STATUS" = "ok"
          test -n "$VERSION"
          test -n "$GIT_TAG"
          test -n "$COMMIT"
          test "$(git rev-parse HEAD)" = "$COMMIT"
          test "$(jq -r '.["fixture-scenario/stock"]' <<<"$GRADES")" = "FAIL"
          dir="artifacts/released-report/fixture-scenario/stock"
          test -f "$dir/report.json"
          test -f "$dir/run.json"
          test "$(jq -r '.summaries[0].grade' "$dir/report.json")" = "FAIL"
          test "$(jq -r .version "$dir/run.json")" = "$VERSION"
          test "$(jq -r .robot.commit "$dir/run.json")" = "$COMMIT"
          if grep -R -n placeholder artifacts/released-report; then
            echo "report still contains placeholder" >&2
            exit 1
          fi
