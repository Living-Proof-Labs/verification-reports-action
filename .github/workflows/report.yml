# SPDX-License-Identifier: Apache-2.0
# Caller-facing verification run. See docs/decisions/0001-composite-vs-reusable-workflow.md.
# The capability-verifier refs are static because GitHub rejects an expression in `uses`.
# Plan resolves every pinned release from its tag and refuses before any trial
# when the tag, commit, digest, or attestation does not match. A tag that peels
# to a commit other than the capability-verifier SHA above is refused there too.
# The resolved verifier commit, verifier image, reporter image and scenario-evaluator
# commit are passed as workflow inputs. The lock cannot carry those fields.
# The caller `evaluators` input is a path or a list. Empty means no evaluators:
# a comment is passed so the built-in run-integrity job stays skipped, and the
# collect job does not run the loader. This repository's evaluators.yml is not
# a default.
name: Verification report
on:
  workflow_call:
    inputs:
      definitions:
        description: Glob of livingproof-verification-definition files in the caller repository.
        type: string
        default: verifications/*.toml
        required: false
      output-dir:
        description: Directory collected into the report artifact.
        type: string
        default: artifacts/verification-report
        required: false
      artifact-name:
        description: >-
          Name of the uploaded report artifact. The default is verification-report.
          A second call in the same workflow needs a different name.
          The plan artifact stays verification-plan for this default, and otherwise
          uses this name with -plan appended.
        type: string
        default: verification-report
        required: false
      version:
        description: Optional version recorded in each run.json. Empty when the caller does not supply one.
        type: string
        default: ''
        required: false
      repository:
        description: Robot repository. Empty means the caller. Another repository requires ref to be its full commit SHA.
        type: string
        default: ''
        required: false
      ref:
        description: Robot commit. Empty means the caller's checked-out commit. A release tag is rejected.
        type: string
        default: ''
        required: false
      media:
        description: Record MCAP and video when capability-verifier records them.
        type: boolean
        default: true
        required: false
      health:
        description: Attach advisory Health from one existing recorded trial per configuration. Requires media.
        type: boolean
        default: false
      health-trial:
        description: Positive trial index to evaluate without rerunning simulation.
        type: number
        default: 1
      comment:
        description: >-
          Ask capability-verifier to comment on a same-repository pull request.
          The comment job declares pull-requests: write. With comment false it never writes.
        type: boolean
        default: false
        required: false
      evaluators:
        description: >-
          Caller declaration list. A path in the caller repository, such as
          evaluators.yml, or the list itself, one line per entry or a YAML list.
          Empty means no evaluators. This repository's file is not a default.
        type: string
        default: ''
        required: false
    outputs:
      report-path:
        description: Directory of the written reports, also uploaded under artifact-name.
        value: ${{ jobs.collect.outputs.report-path }}
      status:
        description: ok when a report was written for every definition. A robot grade does not change this.
        value: ${{ jobs.collect.outputs.status }}
      grade:
        description: The robot grade when there is one result, otherwise the grades JSON map.
        value: ${{ jobs.collect.outputs.grade }}
      grades:
        description: JSON map of definition/configuration to robot grade.
        value: ${{ jobs.collect.outputs.grades }}
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      fixture: ${{ steps.plan.outputs.fixture }}
      fixture_count: ${{ steps.plan.outputs.fixture_count }}
      hallway: ${{ steps.plan.outputs.hallway }}
      hallway_count: ${{ steps.plan.outputs.hallway_count }}
      scenario: ${{ steps.plan.outputs.scenario }}
      scenario_count: ${{ steps.plan.outputs.scenario_count }}
      evaluators: ${{ steps.plan.outputs.evaluators }}
      evaluators_run: ${{ steps.plan.outputs.evaluators_run }}
    steps:
      - name: Caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: caller
          persist-credentials: false
      - id: workflow-source
        env:
          # actionlint 1.7.12's job type omits workflow_repository and workflow_sha.
          # toJson keeps those fields, which name this workflow's own commit.
          JOB_JSON: ${{ toJson(job) }}
        run: |
          set -euo pipefail
          repository="$(jq -r .workflow_repository <<<"$JOB_JSON")"
          sha="$(jq -r .workflow_sha <<<"$JOB_JSON")"
          test -n "$repository"
          test "$repository" != null
          test -n "$sha"
          test "$sha" != null
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.workflow-source.outputs.repository }}
          ref: ${{ steps.workflow-source.outputs.sha }}
          path: action
          persist-credentials: false
      - name: Scripts come from this workflow, not the caller root
        run: |
          set -euo pipefail
          test -f action/src/plan.mjs
          test -f action/src/fixture-run.mjs
          test -f action/src/collect.mjs
          test ! -e src/plan.mjs
          test -d caller
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - id: plan
        working-directory: caller
        env:
          # contents: read is enough. The client sends this only to api.github.com.
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_HEALTH: ${{ inputs.health }}
          INPUT_MEDIA: ${{ inputs.media }}
          INPUT_HEALTH_TRIAL: ${{ inputs.health-trial }}
          INPUT_DEFINITIONS: ${{ inputs.definitions }}
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_EVALUATORS: ${{ inputs.evaluators }}
          INPUT_PLAN_PATH: ${{ github.workspace }}/artifacts/verification-plan/plan.json
          WORKFLOW_REPOSITORY: ${{ steps.workflow-source.outputs.repository }}
        run: node "${{ github.workspace }}/action/src/plan.mjs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name == 'verification-report' && 'verification-plan' || format('{0}-plan', inputs.artifact-name) }}
          path: artifacts/verification-plan/plan.json
          retention-days: 14
          if-no-files-found: error
  fixture:
    needs: plan
    if: needs.plan.outputs.fixture_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.fixture) }}
    steps:
      - name: Caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: caller
          persist-credentials: false
      - id: workflow-source
        env:
          JOB_JSON: ${{ toJson(job) }}
        run: |
          set -euo pipefail
          repository="$(jq -r .workflow_repository <<<"$JOB_JSON")"
          sha="$(jq -r .workflow_sha <<<"$JOB_JSON")"
          test -n "$repository"
          test "$repository" != null
          test -n "$sha"
          test "$sha" != null
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.workflow-source.outputs.repository }}
          ref: ${{ steps.workflow-source.outputs.sha }}
          path: action
          persist-credentials: false
      - name: Scripts come from this workflow, not the caller root
        run: |
          set -euo pipefail
          test -f action/src/fixture-run.mjs
          test ! -e src/fixture-run.mjs
          test -d caller
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact-name == 'verification-report' && 'verification-plan' || format('{0}-plan', inputs.artifact-name) }}
          path: artifacts/verification-plan
      - working-directory: caller
        env:
          INPUT_PLAN_PATH: ${{ github.workspace }}/artifacts/verification-plan/plan.json
          INPUT_DEFINITION: ${{ matrix.definition }}
          INPUT_OUTPUT_DIR: ${{ github.workspace }}/artifacts/fixture-out
          INPUT_VERSION: ${{ inputs.version }}
        run: node "${{ github.workspace }}/action/src/fixture-run.mjs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name == 'verification-report' && format('vra-fixture-{0}', matrix.id) || format('{0}-vra-fixture-{1}', inputs.artifact-name, matrix.id) }}
          path: artifacts/fixture-out
          retention-days: 14
          if-no-files-found: error
  walk-hallway:
    needs: plan
    if: needs.plan.outputs.hallway_count != '0'
    # capability-verifier walk-hallway.yml job scenario declares pull-requests: write.
    # With comment: false that job never writes.
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.hallway) }}
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/walk-hallway.yml@93a490d82ae50e4c551873dfcfaa778adcd5b689 # v2.13.0
    with:
      repository: ${{ matrix.repository }}
      ref: ${{ matrix.ref }}
      configurations: ${{ matrix.configurations }}
      verification-lock: ${{ matrix.lock }}
      verifier-commit: ${{ matrix.verifier_commit }}
      verifier-image: ${{ matrix.verifier_image }}
      reporter-image: ${{ matrix.reporter_image }}
      evaluator-commit: ${{ matrix.evaluator_commit }}
      artifact-prefix: ${{ matrix.artifact_prefix }}
      check: false
      comment: ${{ inputs.comment }}
      media: ${{ inputs.media }}
      evaluators: ${{ needs.plan.outputs.evaluators }}
  scenario:
    needs: plan
    if: needs.plan.outputs.scenario_count != '0'
    # capability-verifier scenario.yml job comment declares pull-requests: write.
    # With comment: false that job never writes.
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.scenario) }}
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/scenario.yml@93a490d82ae50e4c551873dfcfaa778adcd5b689 # v2.13.0
    with:
      repository: ${{ matrix.repository }}
      ref: ${{ matrix.ref }}
      configurations: ${{ matrix.configurations }}
      verification-lock: ${{ matrix.lock }}
      verifier-commit: ${{ matrix.verifier_commit }}
      verifier-image: ${{ matrix.verifier_image }}
      reporter-image: ${{ matrix.reporter_image }}
      evaluator-commit: ${{ matrix.evaluator_commit }}
      artifact-prefix: ${{ matrix.artifact_prefix }}
      check: false
      comment: ${{ inputs.comment }}
      media: ${{ inputs.media }}
      evaluators: ${{ needs.plan.outputs.evaluators }}
  collect:
    needs: [plan, fixture, walk-hallway, scenario]
    if: >-
      always() && !cancelled() &&
      needs.plan.result == 'success' &&
      (needs.fixture.result == 'success' || needs.fixture.result == 'skipped') &&
      (needs.walk-hallway.result == 'success' || needs.walk-hallway.result == 'skipped') &&
      (needs.scenario.result == 'success' || needs.scenario.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      report-path: ${{ steps.collect.outputs.report-path }}
      status: ${{ steps.collect.outputs.status }}
      grade: ${{ steps.collect.outputs.grade }}
      grades: ${{ steps.collect.outputs.grades }}
    steps:
      - name: Caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: caller
          persist-credentials: false
      - id: workflow-source
        env:
          JOB_JSON: ${{ toJson(job) }}
        run: |
          set -euo pipefail
          repository="$(jq -r .workflow_repository <<<"$JOB_JSON")"
          sha="$(jq -r .workflow_sha <<<"$JOB_JSON")"
          test -n "$repository"
          test "$repository" != null
          test -n "$sha"
          test "$sha" != null
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.workflow-source.outputs.repository }}
          ref: ${{ steps.workflow-source.outputs.sha }}
          path: action
          persist-credentials: false
      - name: Scripts come from this workflow, not the caller root
        run: |
          set -euo pipefail
          test -f action/src/collect.mjs
          test ! -e src/collect.mjs
          test -d caller
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact-name == 'verification-report' && 'verification-plan' || format('{0}-plan', inputs.artifact-name) }}
          path: artifacts/verification-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ inputs.artifact-name == 'verification-report' && 'vra-fixture-*' || format('{0}-vra-fixture-*', inputs.artifact-name) }}
          path: downloaded/fixture
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vra-*-capability-report-*
          path: downloaded/reports
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vra-*-evidence-*
          path: downloaded/evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vra-*-mcap-*
          path: downloaded/mcap
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vra-*-video-*
          path: downloaded/video
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.plan.outputs.evaluators_run == 'true'
        with:
          pattern: vra-*-verified-*
          path: downloaded/verified
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.plan.outputs.evaluators_run == 'true'
        with:
          pattern: vra-*-links-*
          path: downloaded/links
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.plan.outputs.evaluators_run == 'true'
        with:
          pattern: vra-*-evaluator-results-*
          path: downloaded/evaluator-results
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.12.23'
          python-version: '3.12.14'
      - name: capability-verifier
        if: needs.plan.outputs.evaluators_run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Living-Proof-Labs/capability-verifier
          ref: 93a490d82ae50e4c551873dfcfaa778adcd5b689
          path: capability-verifier
          persist-credentials: false
      - name: Install capability-verifier
        if: needs.plan.outputs.evaluators_run == 'true'
        working-directory: capability-verifier
        run: uv sync --locked
      - id: evaluators
        if: needs.plan.outputs.evaluators_run == 'true'
        working-directory: capability-verifier
        env:
          PYTHONPATH: src
          INPUT_PLAN_PATH: ${{ github.workspace }}/artifacts/verification-plan/plan.json
          INPUT_DOWNLOAD_ROOT: ${{ github.workspace }}/downloaded
          INPUT_EVALUATORS: ${{ inputs.evaluators }}
          INPUT_CALLER_ROOT: ${{ github.workspace }}/caller
        run: uv run --no-sync python "${{ github.workspace }}/action/src/evaluators_run.py"
      - name: Upload the evaluated capability reports
        if: needs.plan.outputs.evaluators_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}-evaluated-reports
          path: downloaded/reports
          retention-days: 30
          if-no-files-found: error
      - id: collect
        working-directory: caller
        env:
          INPUT_HEALTH: ${{ inputs.health }}
          INPUT_PLAN_PATH: ${{ github.workspace }}/artifacts/verification-plan/plan.json
          INPUT_OUTPUT_DIR: ${{ github.workspace }}/${{ inputs.output-dir }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FIXTURE_ROOT: ${{ github.workspace }}/downloaded/fixture
          INPUT_VERIFIER_ROOT: ${{ github.workspace }}/downloaded
        run: node "${{ github.workspace }}/action/src/collect.mjs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.output-dir }}
          retention-days: 30
          if-no-files-found: error
      - name: Fail when an evaluator declaration produced no provenance
        if: steps.evaluators.outputs.failed == 'true'
        run: exit 1
