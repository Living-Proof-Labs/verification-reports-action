# SPDX-License-Identifier: Apache-2.0
# This repository has no published development image yet. Until one exists, CI
# uses the documented GitHub-hosted ubuntu-24.04 fallback with pinned Node.js,
# uv/Python 3.12, and Task 3.54.0, running the same `task setup` and `task verify` commands.
name: Verify
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    env:
      ACTIONLINT_VERSION: 1.7.12
      # sha256 of actionlint_1.7.12_linux_amd64.tar.gz from the release checksums.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.12'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.54.0'
      - run: task setup
      - run: task verify
      - name: Publish test results
        id: report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Action tests
          path: artifacts/*-tests.xml
          reporter: java-junit
          use-actions-summary: 'true'
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - name: Retain the JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/*-tests.xml
          retention-days: 30
          if-no-files-found: error
      - name: actionlint
        if: ${{ !cancelled() }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
  site-policy:
    # The published-HTML policy must not depend on the interpreter's html.parser, which
    # tokenizes differently across patch releases. So the Python suite also runs on the
    # oldest supported release, the two releases with the known bypasses (3.12.3 is
    # ubuntu-24.04's own python3), and the latest 3.13 and 3.14.
    name: site-policy (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.0', '3.12.3', '3.13.5', '3.13', '3.14']
    env:
      UV_PYTHON_PREFERENCE: only-managed
      PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Python tests on Python ${{ matrix.python }}
        run: |
          set -euo pipefail
          uv sync --locked --python "$PYTHON_VERSION"
          actual="$(uv run --locked --no-sync python -c 'import platform; print(platform.python_version())')"
          echo "Python $actual"
          case "$actual" in
            "$PYTHON_VERSION" | "$PYTHON_VERSION".*) ;;
            *) echo "::error::expected Python $PYTHON_VERSION, got $actual" >&2; exit 1 ;;
          esac
          uv run --locked --no-sync pytest -p no:cacheprovider
  version:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    permissions:
      contents: read
    # Commit of collaboration-guidelines v9.9.10. Issue #4 pins action inputs, not these workflow refs.
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release-candidate.yml@d0d9ae8e684f8a828b774eda01622b7c66e5252e # v9.9.10
  action-smoke:
    name: Mock robot smoke
    needs: version
    if: >-
      !cancelled() &&
      (needs.version.result == 'success' || needs.version.result == 'skipped')
    # capability-verifier's comment job declares pull-requests: write.
    # With comment: false it never writes.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/report.yml
    with:
      definitions: tests/fixtures/robot/verifications/*.toml
      output-dir: artifacts/verification-report
      version: ${{ needs.version.outputs.semver-version }}
      evaluators: evaluators.yml
  action-smoke-check:
    needs: [version, action-smoke]
    if: >-
      !cancelled() &&
      needs.action-smoke.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify workflow outputs
        env:
          STATUS: ${{ needs.action-smoke.outputs.status }}
          GRADES: ${{ needs.action-smoke.outputs.grades }}
          VERSION: ${{ needs.version.outputs.semver-version }}
        run: |
          set -euo pipefail
          test "$STATUS" = "ok"
          test "$(jq -r '.["fixture-hallway/stock"]' <<<"$GRADES")" = "PASS"
          test "$(jq -r '.["fixture-scenario/stock"]' <<<"$GRADES")" = "FAIL"
          if { [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_BASE_REF" = "main" ]; } || \
             { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; }; then
            test -n "$VERSION"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verification-report
          path: artifacts/smoke-report
      - name: Verify the full report
        env:
          VERSION: ${{ needs.version.outputs.semver-version }}
        run: |
          set -euo pipefail
          test ! -e artifacts/smoke-report/report.json
          for spec in \
            "artifacts/smoke-report/fixture-hallway/stock PASS walk-hallway media" \
            "artifacts/smoke-report/fixture-scenario/stock FAIL scenario observation"
          do
            read -r dir grade procedure kind <<<"$spec"
            for name in report.html report.md report.json report.txt SHA256SUMS run.json; do
              test -f "$dir/$name"
            done
            (cd "$dir" && sha256sum -c SHA256SUMS)
            test "$(jq -r '.summaries[0].grade' "$dir/report.json")" = "$grade"
            test "$(jq -r '.outcome[0].grade' "$dir/run.json")" = "$grade"
            test "$(jq -r .procedure "$dir/run.json")" = "$procedure"
            test "$(jq -r .robot.commit "$dir/run.json")" = "$GITHUB_SHA"
            test "$(jq -r .version "$dir/run.json")" = "$VERSION"
            test "$(jq -r .robot.commit "$dir/run.json")" != "$(jq -r .declared_robot.commit "$dir/run.json")"
            test -f "$dir/evidence/observation.json"
            if [ "$kind" = media ]; then
              test -f "$dir/evidence/trial.mcap"
              test -f "$dir/evidence/pass.mp4"
            else
              test ! -e "$dir/evidence/trial.mcap"
            fi
          done
          if grep -R -n placeholder artifacts/smoke-report; then
            echo "report still contains placeholder" >&2
            exit 1
          fi
      - name: Upload the smoke report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-report-${{ needs.version.outputs.semver-version }}
          path: artifacts/smoke-report
          retention-days: 30
          if-no-files-found: error
  g1-smoke:
    name: Real G1 smoke
    needs: version
    if: >-
      !cancelled() &&
      (needs.version.result == 'success' || needs.version.result == 'skipped')
    # capability-verifier's comment job declares pull-requests: write.
    # With comment: false it never writes.
    # ref is the peeled commit of livingproof-unitree-g1 v2.3.34.
    # The definition under tests/smoke/g1 asks for one hallway trial.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/report.yml
    with:
      definitions: tests/smoke/g1/*.toml
      output-dir: artifacts/verification-report
      version: ${{ needs.version.outputs.semver-version }}
      repository: Living-Proof-Labs/livingproof-unitree-g1
      ref: d554c8243a12849dc7fe8acc1921bb3d4e5239a7
      artifact-name: g1-verification-report
      evaluators: evaluators.yml
  g1-smoke-check:
    name: Real G1 smoke report
    needs: [version, g1-smoke]
    if: >-
      !cancelled() &&
      needs.g1-smoke.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      G1_REF: v2.3.34
      G1_COMMIT: d554c8243a12849dc7fe8acc1921bb3d4e5239a7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - name: Verify workflow outputs
        env:
          STATUS: ${{ needs.g1-smoke.outputs.status }}
          GRADES: ${{ needs.g1-smoke.outputs.grades }}
          VERSION: ${{ needs.version.outputs.semver-version }}
        run: |
          set -euo pipefail
          test "$STATUS" = "ok"
          grade="$(jq -r '.["unitree-g1-stock-mujoco-hallway/stock"]' <<<"$GRADES")"
          test -n "$grade"
          test "$grade" != "null"
          if { [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_BASE_REF" = "main" ]; } || \
             { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; }; then
            test -n "$VERSION"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: g1-verification-report
          path: artifacts/smoke-report
      - name: Verify the full report
        env:
          VERSION: ${{ needs.version.outputs.semver-version }}
        run: |
          set -euo pipefail
          set -x
          test ! -e artifacts/smoke-report/report.json
          dir="artifacts/smoke-report/unitree-g1-stock-mujoco-hallway/stock"
          for name in report.html report.md report.json report.txt SHA256SUMS run.json; do
            test -f "$dir/$name"
          done
          (cd "$dir" && sha256sum -c SHA256SUMS)
          grade="$(jq -r '.summaries[0].grade' "$dir/report.json")"
          test -n "$grade"
          test "$grade" != "null"
          test "$(jq -r '.outcome[0].grade' "$dir/run.json")" = "$grade"
          test "$(jq -r '.summaries[0].n' "$dir/report.json")" = "1"
          test "$(jq -r '.outcome[0].trials' "$dir/run.json")" = "1"
          test "$(jq -r .procedure "$dir/run.json")" = "walk-hallway"
          test "$(jq -r .robot.repository "$dir/run.json")" = "Living-Proof-Labs/livingproof-unitree-g1"
          test "$(jq -r .robot.commit "$dir/run.json")" = "$G1_COMMIT"
          test "$(jq -r .declared_robot.ref "$dir/run.json")" = "$G1_REF"
          test "$(jq -r .declared_robot.commit "$dir/run.json")" = "$G1_COMMIT"
          test "$(jq -r .version "$dir/run.json")" = "$VERSION"
          manifest="$dir/evidence/manifest.json"
          test -f "$manifest"
          test "$(jq -r '.trials.results | length' "$manifest")" -ge 1
          test "$(jq -r '.trials.count' "$manifest")" = "1"
          test "$(jq -r '.trials.results | length' "$manifest")" = "1"
          seen=0
          while IFS= read -r rel; do
            case "$rel" in
              ""|null|/*|../*|*/../*|*/..)
                echo "observation path is not inside evidence: $rel" >&2
                exit 1
                ;;
            esac
            obs="$dir/evidence/$rel"
            test -f "$obs"
            test "$(jq -r .format "$obs")" = "livingproof-hallway-observation/2.0.0"
            seen=$((seen + 1))
          done < <(jq -r '.trials.results[].path' "$manifest")
          test "$seen" = "1"
          mapfile -t definitions < <(find artifacts/smoke-report -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          test "${#definitions[@]}" -eq 1
          test "${definitions[0]}" = "unitree-g1-stock-mujoco-hallway"
          test ! -e artifacts/smoke-report/fixture-hallway
          test ! -e artifacts/smoke-report/fixture-scenario
          if grep -R -n placeholder artifacts/smoke-report; then
            echo "report still contains placeholder" >&2
            exit 1
          fi
      - name: Build the G1 report with ./site
        id: g1-site
        uses: ./site
        with:
          runs-dir: artifacts/smoke-report
          output-dir: artifacts/g1-site-check
          reset-history: 'true'
          restore-history: 'false'
          upload-artifact: 'false'
      - name: Require the G1 site build
        if: always()
        env:
          SITE_STATUS: ${{ steps.g1-site.outcome }}
        run: python3 tools/require_reports.py g1 artifacts/g1-site-check
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: g1-verification-report-plan
          path: artifacts/verification-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vra-*-capability-report-*
          path: downloaded/reports
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vra-*-verified-*
          path: downloaded/verified
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vra-*-evidence-*
          path: downloaded/evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vra-*-mcap-*
          path: downloaded/mcap
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vra-*-video-*
          path: downloaded/video
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vra-*-links-*
          path: downloaded/links
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vra-*-evaluator-results-*
          path: downloaded/evaluator-results
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.12.23'
          python-version: '3.12.14'
      - name: capability-verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Living-Proof-Labs/capability-verifier
          ref: bd6be5217b52b1348b4dc23613ee06d44bed9519
          path: capability-verifier
          persist-credentials: false
      - name: Install capability-verifier
        working-directory: capability-verifier
        run: uv sync --locked
      - name: Keep the non-advisory declaration lines
        id: advisory-off
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/drop_advisory_lines.py evaluators.yml artifacts/advisory-off-lines.txt
      - id: evaluators
        name: Re-run collect without advisory lines
        working-directory: capability-verifier
        env:
          PYTHONPATH: src
          INPUT_PLAN_PATH: ${{ github.workspace }}/artifacts/verification-plan/plan.json
          INPUT_DOWNLOAD_ROOT: ${{ github.workspace }}/downloaded
          INPUT_EVALUATORS: ${{ steps.advisory-off.outputs.lines }}
          INPUT_CALLER_ROOT: ${{ github.workspace }}
        run: uv run --no-sync python "${{ github.workspace }}/src/evaluators_run.py"
      - name: Fail when an advisory-off declaration produced no provenance
        if: steps.evaluators.outputs.failed == 'true'
        run: exit 1
      - name: Assemble the advisory-off report
        env:
          INPUT_PLAN_PATH: artifacts/verification-plan/plan.json
          INPUT_OUTPUT_DIR: artifacts/advisory-off
          INPUT_VERIFIER_ROOT: downloaded
          INPUT_VERSION: ${{ needs.version.outputs.semver-version }}
        run: node src/collect.mjs
      - name: Compare the advisory on and off reports
        env:
          ADVISORY_LINES: ${{ steps.advisory-off.outputs.count }}
          ON_GRADE: ${{ needs.g1-smoke.outputs.grade }}
          ON_GRADES: ${{ needs.g1-smoke.outputs.grades }}
        run: |
          python tools/compare_integrity.py \
            --on artifacts/smoke-report \
            --off artifacts/advisory-off \
            --grade FAIL \
            --advisory-lines "$ADVISORY_LINES" \
            --grades "$ON_GRADES"
          test "$ON_GRADE" = "FAIL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g1-advisory-off-report
          path: artifacts/advisory-off
          retention-days: 30
          if-no-files-found: error
      - name: Upload the smoke report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g1-smoke-report-${{ needs.version.outputs.semver-version }}
          path: artifacts/smoke-report
          retention-days: 30
          if-no-files-found: error
  site-smoke:
    needs: action-smoke
    if: >-
      !cancelled() &&
      needs.action-smoke.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verification-report
          path: artifacts/smoke-report
      - name: Build reports section via ./site
        id: site
        uses: ./site
        with:
          runs-dir: artifacts/smoke-report
          output-dir: artifacts/site-smoke/reports
          reset-history: 'true'
      - name: Verify built reports section
        env:
          REPORTS_DIR: ${{ steps.site.outputs.reports-dir }}
          INDEX_PATH: ${{ steps.site.outputs.index-path }}
          RUNS_COUNT: ${{ steps.site.outputs.runs-count }}
          ARTIFACT_ONLY: ${{ steps.site.outputs.artifact-only }}
        run: |
          set -euo pipefail
          test "$REPORTS_DIR" = "artifacts/site-smoke/reports"
          test -f "$INDEX_PATH"
          test "$RUNS_COUNT" = "2"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            test "$ARTIFACT_ONLY" = "true"
          else
            test "$ARTIFACT_ONLY" = "false"
          fi
          grep -Fq "https://docs.livingprooflabs.com/livingproof-verification/reports/index.html" "$INDEX_PATH"
          python3 -c 'import pathlib, sys; t = pathlib.Path(sys.argv[1]).read_text(); assert t.index("fixture-scenario-stock/latest/") < t.index("fixture-hallway-stock/latest/")' "$INDEX_PATH"
          python3 tools/site_fixture.py check "$REPORTS_DIR"
  verification-gate:
    name: Repository verification gate
    # always() so a failed or cancelled dependency still reports this check.
    # version is skipped unless this is a push or a pull request into main;
    # that skip is expected. Any other skip, failure, or cancellation fails.
    if: always()
    needs: [verify, site-policy, version, action-smoke, action-smoke-check, g1-smoke, g1-smoke-check, site-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - name: Require complete successful verification evidence
        run: node tools/verification-gate.mjs
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
          VERIFICATION_EVENT: ${{ github.event_name }}
          VERIFICATION_BASE_REF: ${{ github.base_ref }}
