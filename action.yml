# SPDX-License-Identifier: Apache-2.0
name: Living Proof Verification Reports
description: >-
  Run capability verification for the caller repository and produce a traceable
  verification report. Robot repositories call .github/workflows/report.yml.
  This composite runs this repository's fixture definitions and rejects every
  other caller, because a composite action cannot call capability-verifier's
  matrix workflows.
inputs:
  definitions:
    description: Glob of livingproof-verification-definition files in the caller repository.
    required: false
    default: verifications/*.toml
  output-dir:
    description: Directory where the verification report artifacts will be written.
    required: false
    default: artifacts/verification-report
  version:
    description: >-
      Optional version recorded in each run.json. Empty when the caller does not
      supply one.
    required: false
    default: ''
  repository:
    description: >-
      Robot repository. Empty means the caller. Another repository requires ref
      to be its full commit SHA.
    required: false
    default: ''
  ref:
    description: >-
      Robot commit. Empty means the caller's checked-out commit. A release tag
      is rejected.
    required: false
    default: ''
  media:
    description: Record MCAP and video when capability-verifier records them.
    required: false
    default: 'true'
  comment:
    description: >-
      Ask capability-verifier to comment on a same-repository pull request.
      The comment job declares pull-requests: write. With comment false it never writes.
    required: false
    default: 'false'
outputs:
  report-path:
    description: Directory of the written reports.
    value: ${{ steps.run.outputs.report-path }}
  status:
    description: ok when a report was written for every definition. A robot grade does not change this.
    value: ${{ steps.run.outputs.status }}
  grade:
    description: The robot grade when there is one result, otherwise the grades JSON map.
    value: ${{ steps.run.outputs.grade }}
  grades:
    description: JSON map of definition/configuration to robot grade.
    value: ${{ steps.run.outputs.grades }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        INPUT_DEFINITIONS: ${{ inputs.definitions }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_MEDIA: ${{ inputs.media }}
        INPUT_COMMENT: ${{ inputs.comment }}
        WORKFLOW_REPOSITORY: ${{ github.action_repository }}
      run: node "${{ github.action_path }}/src/run.mjs"
