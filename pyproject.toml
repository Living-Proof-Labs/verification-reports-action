[project]
name = "verification-reports-action"
version = "0.0.0"
description = "Reusable Living Proof Verification Reports GitHub Action."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-timeout>=2.3.1",
  "ruff>=0.8.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# A scanner or parser regression fails one test in seconds rather than the 10-minute job.
timeout = 60
pythonpath = ["src", "tools", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
