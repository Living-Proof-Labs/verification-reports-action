[project]
name = "verification-reports-action"
version = "0.0.0"
description = "Reusable Living Proof Verification Reports GitHub Action."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-timeout>=2.3.1",
  "ruff>=0.8.4",
  "playwright==1.56.0",
  "livingproof-capability-report==3.16.0",
  "livingproof-common==1.0.0",
]
docs = [
  "zensical==0.0.73",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# A scanner or parser regression fails one test in seconds rather than the 10-minute job.
timeout = 60
pythonpath = ["src", "tools", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.uv.sources]
livingproof-capability-report = { url = "https://github.com/Living-Proof-Labs/livingproof-capability-report/releases/download/v3.16.0/livingproof_capability_report-3.16.0-py3-none-any.whl" }
livingproof-common = { url = "https://github.com/Living-Proof-Labs/livingproof-common/releases/download/v1.0.0/livingproof_common-1.0.0-py3-none-any.whl" }
